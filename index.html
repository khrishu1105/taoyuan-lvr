<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃園實登查詢站 · 貝多房地產</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#0d2b45;--navy2:#123a5e;--blue:#1a6fb0;--blue-l:#e8f1f9;
    --ink:#1b2733;--sub:#6b7885;--line:#e4e9ef;--bg:#eef1f5;--card:#fff;
    --warn:#d0452b;--good:#1f9d57;
    --presale:#1a6fb0;--resale:#0f897c;--land:#b07f38;--bargain:#1f9d57;
    --shadow:0 1px 3px rgba(16,42,67,.06),0 1px 2px rgba(16,42,67,.04);
    --shadow-lg:0 8px 30px rgba(16,42,67,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:0 22px}
  a{color:var(--blue)}
  /* ---- splash ---- */
  #splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(150deg,var(--navy),var(--navy2));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .bars{display:flex;align-items:flex-end;gap:6px;height:56px}
  #splash .bars i{width:11px;background:#fff;border-radius:3px;animation:bar 1s ease-in-out infinite}
  #splash .bars i:nth-child(1){height:40%;animation-delay:0s}
  #splash .bars i:nth-child(2){height:65%;animation-delay:.15s}
  #splash .bars i:nth-child(3){height:90%;animation-delay:.3s}
  #splash .bars i:nth-child(4){height:55%;animation-delay:.45s}
  @keyframes bar{0%,100%{transform:scaleY(.5);opacity:.6}50%{transform:scaleY(1);opacity:1}}
  #splash h2{color:#fff;font-size:22px;font-weight:700;letter-spacing:2px}
  #splash p{color:#9fc0dc;font-size:13px;letter-spacing:1px}
  /* ---- app bar ---- */
  .appbar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .bar-inner{display:flex;align-items:center;gap:26px;min-height:62px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;padding:10px 0}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--navy),var(--blue));
    display:flex;align-items:flex-end;justify-content:center;gap:2.5px;padding:8px 7px}
  .brand .logo i{width:4px;background:#fff;border-radius:1.5px;opacity:.95}
  .brand .logo i:nth-child(1){height:36%}.brand .logo i:nth-child(2){height:62%}.brand .logo i:nth-child(3){height:100%}
  .brand h1{font-size:18px;font-weight:800;letter-spacing:.5px;line-height:1.1}
  .brand .tag{display:block;font-size:10.5px;color:var(--sub);letter-spacing:1.5px;font-weight:500}
  .tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
  .tab{padding:9px 16px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;border-radius:8px;
    display:flex;align-items:center;gap:7px;transition:.15s;border:1px solid transparent}
  .tab:hover{background:var(--bg);color:var(--ink)}
  .tab.on{background:var(--accent,var(--blue));color:#fff}
  .tab.on .n{color:rgba(255,255,255,.75)}
  .tab .n{font-size:11px;font-weight:500;color:#a9b4bf}
  /* ---- subbar ---- */
  .subbar{background:var(--card);border-bottom:1px solid var(--line)}
  .sub{font-size:12.5px;color:var(--sub);padding:9px 0}
  .sub b{color:var(--blue);font-weight:700}
  .sub .lag{color:#b06a00;cursor:help;border-bottom:1px dotted #b06a00}
  main{padding-bottom:40px}
  /* ---- stat cards ---- */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;padding:22px 0 18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--blue))}
  .stat .k{font-size:11.5px;color:var(--sub);letter-spacing:.5px}
  .stat .v{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:3px;color:var(--navy)}
  .stat .v small{font-size:12px;font-weight:500;color:var(--sub)}
  /* ---- filters ---- */
  .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .filters label{font-size:11.5px;color:var(--sub);display:flex;flex-direction:column;gap:5px;font-weight:600}
  .filters select,.filters input{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;background:#fbfcfd;color:var(--ink);transition:.15s;font-weight:400}
  .filters select:focus,.filters input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l);background:#fff}
  .filters input[type=text]{min-width:210px}
  .chk{flex-direction:row!important;align-items:center;gap:6px;height:35px;font-weight:500;color:var(--ink)}
  .count{margin-left:auto;font-size:12.5px;color:var(--sub);font-weight:600;align-self:center}
  /* ---- table ---- */
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  thead th{background:#f6f8fa;font-size:11.5px;letter-spacing:.3px;color:#5a6a78;text-align:right;font-weight:700;
    padding:12px 13px;border-bottom:2px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:62px}
  thead th.l{text-align:left}
  thead th:hover{background:#eef2f6;color:var(--blue)}
  thead th small{font-weight:500;color:#9aa7b3}
  tbody td{padding:11px 13px;border-bottom:1px solid #eef2f5;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
  tbody td.l{text-align:left}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.prow{cursor:pointer}
  tbody tr.rprow{cursor:pointer}
  tbody tr.rprow:hover{background:#f0f6ff}
  .pjstat{display:flex;gap:12px;flex-wrap:wrap;margin:2px 0 16px}
  .pjc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 16px;min-width:120px}
  .pjc span{display:block;font-size:11px;color:var(--sub)}
  .pjc b{font-size:21px;color:var(--navy)}
  .pjc small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
  .dwrap h4{margin:14px 0 6px}
  .dwrap .handrow{display:none}
  .dwrap.showhand .handrow{display:table-row}
  .bldgview .handrow{display:none}
  .bldgview.showhand .handrow{display:table-row}
  .bldgview h2{font-size:20px;margin:8px 0 14px}
  .backbtn{background:var(--blue-l);color:var(--blue);border:none;border-radius:6px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:6px}
  .backbtn:hover{background:var(--blue);color:#fff}
  .handtoggle{display:inline-block;font-size:12px;color:var(--sub);margin:0 0 8px;cursor:pointer}
  .handtoggle input{vertical-align:-1px;margin-right:4px}
  tbody tr:hover{background:#f7fafc}
  .pname{font-weight:700;color:var(--navy)}
  .dist{display:inline-block;font-size:10.5px;color:var(--blue);background:var(--blue-l);border-radius:5px;padding:1.5px 7px;margin-right:6px;font-weight:600}
  .term{color:var(--warn);font-weight:700}.muted{color:#c2cad2}.price{font-weight:700;color:var(--navy)}
  .rng{font-size:11.5px;color:var(--sub)}
  tr.detail td{background:#f7fafc;padding:0}
  .dwrap{padding:8px 16px 16px 40px}
  .dwrap h4{font-size:12.5px;color:var(--navy);margin:10px 0 7px;font-weight:700}
  table.tx{border:1px solid var(--line);box-shadow:none}
  table.tx th{background:#eef2f6;font-size:11px;padding:7px 10px;position:static}
  table.tx td{padding:6px 10px;font-size:12px}
  .badge-term{background:#fbe4de;color:var(--warn);font-size:10px;border-radius:4px;padding:1px 6px;font-weight:600}
  .badge-pre{background:#e7eefb;color:#2f5fb0;font-size:10px;border-radius:4px;padding:1px 6px;font-weight:600;white-space:nowrap}
  .badge-move{background:#eef3fb;color:#3f6bb0;font-size:10px;border-radius:4px;padding:1px 6px;font-weight:600;white-space:nowrap}
  .badge-resale{background:#e3f3ea;color:#1a8a4f;font-size:10px;border-radius:4px;padding:1px 6px;font-weight:600;white-space:nowrap}
  .zone{display:inline-block;font-size:10px;color:#8a6d3b;background:#f6efe0;border-radius:4px;padding:1px 6px;font-weight:600}
  sup.umk{font-size:8px;color:#c0392b;cursor:help;margin-left:1px}
  .badge-custom{background:#efe7fb;color:#7a4fb0;font-size:9px;border-radius:4px;padding:1px 5px;font-weight:600;margin-left:3px;cursor:help}
  .badge-huan{background:#fff2d9;color:#a6771a;font-size:10px;border-radius:4px;padding:1px 6px;font-weight:600;white-space:nowrap}
  .badge-rt{background:#e0f5f0;color:#0a8f77;font-size:9px;border-radius:4px;padding:1px 5px;font-weight:600;margin-left:3px}
  .loading{text-align:center;padding:60px 20px;color:var(--sub);font-size:14px}
  .pager{display:flex;gap:10px;align-items:center;justify-content:center;padding:18px;font-size:13px}
  .pager button{font:inherit;padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-weight:600;color:var(--navy)}
  .pager button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
  .pager button:disabled{opacity:.4;cursor:default}
  footer{color:var(--sub);font-size:11.5px;padding:24px 0 44px;line-height:1.75}
  footer b{color:var(--ink)}
  #map{height:560px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);z-index:1}
  .maplegend{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub);margin:12px 0 4px}
  .maplegend .bar{height:12px;width:180px;border-radius:6px;background:linear-gradient(90deg,#2e9e5b,#e0a52b,#d0452b)}
  .leaflet-popup-content{font-family:inherit;font-size:13px}
  .leaflet-popup-content b{color:var(--navy)}
  .maptip{background:transparent!important;border:none!important;box-shadow:none!important;color:#fff;
    font-weight:700;font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.7);padding:0}
  .maptip::before{display:none!important}
  @media(max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}.hidem{display:none}
    .bar-inner{min-height:auto;padding:8px 0}.tabs{margin-left:0;width:100%}.tab{flex:1;justify-content:center;padding:8px 8px}
    thead th{position:static}}
</style>
</head>
<body>
<div id="splash">
  <div class="bars"><i></i><i></i><i></i><i></i></div>
  <h2>桃園實登查詢站</h2>
  <p>載入實價登錄資料中…</p>
</div>

<header class="appbar"><div class="wrap bar-inner">
  <div class="brand">
    <div class="logo"><i></i><i></i><i></i></div>
    <div><h1>桃園實登查詢站</h1><span class="tag">貝多房地產 · 實價登錄分析</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
</div></header>
<div class="subbar"><div class="wrap"><div class="sub" id="sub">載入中…</div></div></div>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
  <div id="tablewrap"></div>
  <footer id="foot"></footer>
</main>

<script>
let META=null;
const CACHE={};            // 各品項資料快取
let TAB="presale";
const state={presale:{},resale:{},land:{}};

const EMBED = window.__EMBED__ || null;   // 單機版會有；伺服器版走 fetch
async function load(name){
  if(CACHE[name]) return CACHE[name];
  if(EMBED && EMBED[name]){ CACHE[name]=EMBED[name]; return CACHE[name]; }
  const r=await fetch("data/"+name+".json"); const j=await r.json(); CACHE[name]=j; return j;
}

const TABS=[
  {id:"presale",label:"預售屋",color:"var(--presale)"},
  {id:"resale", label:"中古/成屋",color:"var(--resale)"},
  {id:"land",   label:"土地",color:"var(--land)"},
  {id:"map",    label:"地圖",color:"var(--navy)"},
  {id:"trend",  label:"趨勢",color:"var(--blue)"},
];

const SOURCE = `資料源：<b>內政部不動產成交案件實際資訊</b>（實價登錄開放資料·每旬更新）· 桃園市`;
function rangeText(t){
  const r={presale:[META.presale_min,META.presale_max],resale:[META.resale_min,META.resale_max],land:[META.land_min,META.land_max]}[t];
  return r&&r[0]?`本頁資料涵蓋 <b>${r[0]} ～ ${r[1]}</b>`:"";
}
function freshText(){
  const latest = META.date_max || META.resale_max || "";
  const synced = META.updated_at || "";
  let s = `📅 資料最新交易日 <b>${latest}</b>`;
  if(synced) s += ` · 最後同步 ${synced}`;
  s += ` · <span class="lag" title="實價登錄自成交、過戶登記到揭露公開約有 1～3 個月落差，樂居/591/內政部官網皆同。近月筆數會持續補登。">ⓘ 約 1～3 個月申報揭露落差</span>`;
  return s;
}
function setSub(t){document.getElementById("sub").innerHTML = freshText() + "<br>" + SOURCE + " · " + rangeText(t);}
async function boot(){
  META = await load("meta");
  setSub("presale");
  document.getElementById("tabs").innerHTML = TABS.map(t=>
    `<div class="tab" data-t="${t.id}" style="--accent:${t.color}">${t.label}<span class="n" id="n_${t.id}"></span></div>`).join("");
  document.getElementById("n_presale").textContent = META.presale_projects+" 案";
  document.getElementById("n_resale").textContent = (META.resale_tx/1000).toFixed(0)+"k 筆";
  document.getElementById("n_land").textContent = (META.land_tx/1000).toFixed(0)+"k 筆";
  document.querySelectorAll(".tab").forEach(el=>el.addEventListener("click",()=>switchTab(el.dataset.t)));
  document.getElementById("foot").innerHTML =
    `<b>近3年中位</b>：因近年房市漲幅大，全期均價會被早年低價拉低，故另計近3年(${META.recent_cut||''}起)中位單價較貼近現況，地圖顏色亦採近3年。`+
    `口徑：單價採<b>去車位單價</b>＝(總價−車位價)/(建物−車位面積)換算萬/坪，避免車位灌入拉低。行情統計與檢便宜<b>只採住宅、排除特殊交易</b>(親友/持分/含增建/含稅費等，來自官方備註)；店面/辦公/工業歸「非住宅」、格局多為0房，可用篩選開關切換。預售「有效筆數＝總筆－解約」。`+
    `筆數≠戶數(含車位分列、簽約時間差；預售2021/7前為舊制)。<b>中古的「社區/建案名」是用地號比對我方預售資料自動推得</b>(內政部中古開放資料本身無社區名)，只標對得到的、無把握就留空；預售分頁「中古轉售」=該建案<b>確認二次轉售</b>筆數(同一門牌在成屋檔出現≥2次的超出部分)；剛交屋建案的成屋紀錄多為建商成屋/交屋首購=第一手，不算轉售，故此數通常遠小於戶數。`+
    `<br>本工具為靜態頁，資料源內政部政府開放資料(可重製散布，須標示來源)，非官方系統。更新：重跑 etl.py。 · 製作 khrishu`;
  switchTab("presale");
  const sp=document.getElementById("splash"); if(sp) setTimeout(()=>sp.classList.add("hide"),350);
}

function switchTab(t){
  TAB=t;
  document.querySelectorAll(".tab").forEach(el=>el.classList.toggle("on",el.dataset.t===t));
  setSub(t);
  ({presale:renderPresale,resale:renderResale,land:renderLand,bargain:renderBargains,map:renderMap,trend:renderTrends})[t]();
}

function distOptions(){return `<option value="">全部</option>`+META.districts.map(d=>`<option>${d}</option>`).join("");}
// 容錯搜尋：忽略空格/標點/全半形，讓「美術 水公園」「美術·水公園」都比對得到
function norm(s){return (s||"").replace(/[\s·．・\-－_／/（）()，,、।]/g,"").toLowerCase();}
function matchQ(q,...fields){const nq=norm(q); return !nq||fields.some(f=>norm(f).includes(nq));}
function fmt(v,dp=1){return v==null?'<span class="muted">—</span>':Number(v).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp});}
function statCards(cards){document.getElementById("stats").innerHTML=cards.map(c=>`<div class="stat"><div class="k">${c[0]}</div><div class="v">${c[1]} <small>${c[2]||''}</small></div></div>`).join("");}
function shortAddr(d,a){a=a||"";const p="桃園市"+d;return a.startsWith(p)?a.slice(p.length):a.replace("桃園市","");}

/* ================= 預售屋（建案聚合 + drill） ================= */
async function renderPresale(){
  document.getElementById("tablewrap").innerHTML=`<div class="loading">載入預售屋資料…</div>`;
  const P=await load("presale_projects"); const s=state.presale;
  statCards([["預售逐筆",META.presale_tx.toLocaleString()],["建案數",META.presale_projects.toLocaleString(),"個"],
    ["解約筆數",META.presale_term.toLocaleString(),`(${(META.presale_term/META.presale_tx*100).toFixed(1)}%)`],
    ["季別",META.seasons.length,"季"],["行政區",META.districts.length,"區"]]);
  document.getElementById("filters").innerHTML=`
    <label>行政區<select id="fD">${distOptions()}</select></label>
    <label>建案/門牌關鍵字<input type="text" id="fQ" placeholder="站前、A22、水公園"></label>
    <label>最少有效筆數<input type="number" id="fMin" value="0" min="0" style="width:80px"></label>
    <label class="chk"><input type="checkbox" id="fTerm"> 只看有解約</label>
    <label>排序<select id="fS"><option value="valid">有效筆數↓</option><option value="med3">近3年中位↓</option><option value="avg">全期均價↓</option><option value="avgtot">均總價↓</option><option value="p2">最新登錄↓</option></select></label>
    <span class="count" id="cnt"></span>`;
  const draw=()=>{
    const d=fD.value,q=fQ.value.trim(),mn=+fMin.value||0,ot=fTerm.checked,sk=fS.value;
    let list=P.filter(p=>(!d||p.d===d)&&(!mn||p.valid>=mn)&&(!ot||p.term)&&matchQ(q,p.n,p.d));
    list.sort((a,b)=>{let x=a[sk],y=b[sk];if(sk==="p2")return (y||"").localeCompare(x||"");return (y??-1)-(x??-1);});
    cnt.textContent=`符合 ${list.length} 案 / 共 ${P.length}`;
    document.getElementById("tablewrap").innerHTML=`<table><thead><tr>
      <th class="l">建案 / 行政區</th><th data-sk="valid">有效/總</th><th class="hidem">解約</th><th data-sk="avg">全期<br><small>均價</small></th>
      <th data-sk="med3">近3年<br><small>中位</small></th><th class="hidem">單價區間</th><th data-sk="avgtot">均總價<br><small>萬</small></th><th class="hidem">主力房</th><th>中古<br><small>轉售</small></th><th class="l" data-sk="p2">登錄期間</th>
      </tr></thead><tbody>${list.slice(0,400).map(pRow).join("")||empty(10)}</tbody></table>`;
    document.querySelectorAll("tr.prow").forEach(tr=>tr.addEventListener("click",()=>{const [d,n]=decodeURIComponent(tr.dataset.k).split("|");showBuilding(d,n);}));
    wireSort("fS");
  };
  ["fD","fQ","fMin","fTerm","fS"].forEach(id=>document.getElementById(id).addEventListener("input",draw));
  draw();
}
function pRow(p){return `<tr class="prow" data-k="${encodeURIComponent(p.d+"|"+p.n)}">
  <td class="l"><span class="dist">${p.d}</span><span class="pname">${p.n}</span></td>
  <td>${p.valid}<small style="color:#bbb">/${p.cnt}</small></td>
  <td class="hidem">${p.term?`<span class="term">${p.term}</span>`:'<span class="muted">0</span>'}</td>
  <td class="price">${fmt(p.avg)}</td>
  <td class="price" style="color:var(--presale)">${p.med3!=null?fmt(p.med3):'<span class="muted">—</span>'}</td>
  <td class="hidem">${p.lo!=null?`<span class="rng">${fmt(p.lo)}–${fmt(p.hi)}</span>`:'<span class="muted">—</span>'}</td>
  <td>${p.avgtot?p.avgtot.toLocaleString():'<span class="muted">—</span>'}</td>
  <td class="hidem">${p.room?p.room+'房':'<span class="muted">—</span>'}</td>
  <td>${p.resale?`<span class="term" style="color:var(--resale)">${p.resale}</span>`:'<span class="muted">0</span>'}</td>
  <td class="l"><span class="rng">${p.p1||''} ~ ${p.p2||''}</span></td></tr>`;}
async function showBuilding(d,n){
  window.scrollTo(0,0);
  document.getElementById("stats").innerHTML="";
  document.getElementById("filters").innerHTML="";
  document.getElementById("tablewrap").innerHTML=`<div class="bldgview" id="bview"><button class="backbtn" onclick="renderPresale()">← 返回建案列表</button><h2><span class="dist">${d}</span>${n}</h2><p style="color:#888">載入全案成交中…</p></div>`;
  const noResale=EMBED&&!EMBED.resale_tx;   // 單機精簡版無成屋資料
  const [PTX,RTX]=await Promise.all([load("presale_tx"),noResale?Promise.resolve([]):load("resale_tx")]);
  // 預售期成交（同建案名，含跨門牌）
  const pre=PTX.filter(r=>r[0]===d&&r[1]===n).sort((a,b)=>(b[3]||"").localeCompare(a[3]||""));
  // 交屋後成屋成交（用建案名歸戶，跨門牌自動合併）
  const res=RTX.filter(r=>r[0]===d&&r[12]===n).sort((a,b)=>(b[2]||"").localeCompare(a[2]||""));
  const hand=res.filter(r=>r[18]==="交屋"), resold=res.filter(r=>r[18]==="轉售"), huan=res.filter(r=>r[18]==="換約");
  const avg=a=>{const v=a.filter(x=>x>0);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;};
  const pa=avg(pre.filter(r=>!r[12]).map(r=>r[9])), ha=avg(hand.map(r=>r[10])), ra=avg(resold.map(r=>r[10]));
  const A=v=>v!=null?v.toFixed(1)+" 萬/坪":"—";
  const grow=(pa!=null&&ra!=null)?(ra-pa)/pa*100:null;
  const nAddr=new Set(res.map(r=>r[1]).concat(pre.map(r=>r[2])).filter(Boolean)).size;
  const stat=`<div class="pjstat">
    <div class="pjc" title="預售簽約與交屋過戶多為同一批戶的兩次登記（成交價相同），第一手戶數以預售簽約為準，不與交屋相加">
      <span>第一手（首購）</span><b>${pre.length}</b> 戶<small>均 ${A(pa)}　其中 ${hand.length} 戶已交屋過戶</small></div>
    <div class="pjc"><span>中古轉售</span><b style="color:var(--resale)">${resold.length}</b> 筆<small>${ra!=null?"均 "+A(ra):"—"}</small></div>
    ${grow!=null?`<div class="pjc"><span>預售價→轉售均價</span><b style="color:${grow>0?'#c0392b':'#1a8a4f'}">${grow>0?'+':''}${grow.toFixed(0)}%</b><small>${A(pa)} → ${A(ra)}</small></div>`:''}
    <div class="pjc"><span>涵蓋門牌</span><b>${nAddr}</b> 個<small>同社區已合併</small></div>
  </div>`;
  const col=v=>v>0?'#c0392b':v<0?'#1a8a4f':'#888';
  // 併成單一全案成交列表：預售+交屋+轉售依日期排，記號區分
  const all=[];
  pre.forEach(r=>all.push({date:r[3],addr:r[2],rm:r[4],hl:r[5],ba:r[6],deed:r[13],pka:r[14],pkp:r[15],unit:r[9],total:r[10],src:"預售",term:r[12],est:0}));
  res.forEach(r=>all.push({date:r[2],addr:r[1],rm:r[5],hl:r[6],ba:r[7],deed:r[19],pka:r[20],pkp:r[21],unit:r[10],total:r[11],src:"成屋",flag:r[18],age:r[4],est:r[25],pd:r[22],pu:r[23],pt:r[24],rt:r[27]}));
  all.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const uniRow=x=>{
    const isHand=x.src==="成屋"&&x.flag==="交屋";
    const badge=(x.src==="預售"?(x.term?'<span class="badge-term">預售·解約</span>':'<span class="badge-pre">預售簽約</span>'):flagBadge(x.flag)||'<span class="muted">成屋</span>')+(x.rt?'<span class="badge-rt" title="來自即時查詢網，批次尚未收錄">即時</span>':'');
    let extra="";
    if(x.flag==="轉售"&&x.pu){const cu=(x.unit-x.pu)/x.pu*100, ct=x.pt?(x.total-x.pt)/x.pt*100:null;
      extra=`<span style="color:${col(cu)}">單價${cu>0?'+':''}${cu.toFixed(1)}%</span>`+(ct!=null?` · <span style="color:${col(ct)}">總價${ct>0?'+':''}${ct.toFixed(1)}%</span> <small style="color:#999">前手${x.pd}</small>`:'');}
    return `<tr${isHand?' class="handrow"':''}><td>${badge}</td><td>${x.date||''}</td><td class="l">${shortAddr(d,x.addr)}</td><td>${x.age!=null?x.age+'年':'<span class="muted">—</span>'}</td><td>${x.rm}房${x.hl}廳${x.ba}衛</td><td>${x.deed!=null?x.deed.toFixed(1):'—'}</td><td>${carCell(x.pka,x.pkp,x.est)}</td><td style="text-align:right">${unitCell(x.unit,x.est)}</td><td style="text-align:right">${x.total!=null?x.total.toLocaleString():'—'}</td><td class="l">${extra}</td></tr>`;};
  const note=noResale?'<p style="color:#888;margin:4px 0">單機精簡版不含成屋資料，交屋後成交請用完整站查詢。</p>':'';
  const table=`<h4>全案歷次登錄 <small style="font-weight:400;color:#999">預售簽約 ${pre.length}．交屋過戶 ${hand.length}${huan.length?"．換約 "+huan.length:""}．中古轉售 ${resold.length}${res.some(r=>r[27])?"　<span style='color:#0a8f77'>含即時資料</span>":""}</small></h4>
    ${hand.length?`<label class="handtoggle"><input type="checkbox" onchange="document.getElementById('bview').classList.toggle('showhand',this.checked)">顯示交屋過戶 ${hand.length} 筆（與預售簽約為同批戶，預設隱藏避免重複）</label>`:''}
    <table class="tx"><thead><tr><th>記號</th><th>成交日</th><th class="l">門牌</th><th>屋齡</th><th>格局</th><th>權狀坪</th><th>車位坪/價</th><th style="text-align:right">單價萬/坪</th><th style="text-align:right">總價萬</th><th class="l">轉售對前手</th></tr></thead><tbody>${all.map(uniRow).join("")}</tbody></table>`;
  document.getElementById("bview").innerHTML=`<button class="backbtn" onclick="renderPresale()">← 返回建案列表</button><h2><span class="dist">${d}</span>${n}</h2>`+stat+note+table;
}

/* ================= 中古/成屋（逐筆分頁 + 區×型態統計） ================= */
function liteNotice(){document.getElementById("filters").innerHTML="";document.getElementById("stats").innerHTML="";
  document.getElementById("tablewrap").innerHTML=`<div class="loading">此為單機精簡版，僅內建預售屋完整資料。<br>中古/土地逐筆明細請用「完整站」（資料夾＋開啟查詢頁.command）。</div>`;}
async function renderResale(){
  if(EMBED && !EMBED.resale_tx){liteNotice();return;}
  document.getElementById("tablewrap").innerHTML=`<div class="loading">載入中古屋 ${(META.resale_tx/1000).toFixed(0)}k 筆…（首次較久）</div>`;
  const [TX,AREA,BLDG]=await Promise.all([load("resale_tx"),load("resale_area"),load("resale_bldg")]);
  const s=state.resale; s.page=s.page||0; s.mode=s.mode||"list";
  const btypes=[...new Set(AREA.map(a=>a.bt))];
  statCards([["中古逐筆",META.resale_tx.toLocaleString()],["確認二次轉售",(META.resale_resold||0).toLocaleString(),"筆"],
    ["已對到建案名",META.resale_named.toLocaleString(),`(${(META.resale_named/META.resale_tx*100).toFixed(0)}%)`],
    ["季別",META.seasons.length,"季"],["涵蓋",META.resale_min.slice(0,7),`~${META.resale_max.slice(0,7)}`]]);
  document.getElementById("filters").innerHTML=`
    <label>檢視<select id="fMode"><option value="list">逐筆明細</option><option value="bldg">社區/棟聚合（成屋成交）</option></select></label>
    <label>行政區<select id="fD">${distOptions()}</select></label>
    <label id="wB">建物型態<select id="fB"><option value="">全部</option>${btypes.map(b=>`<option>${b}</option>`).join("")}</select></label>
    <label>門牌/路段關鍵字<input type="text" id="fQ" placeholder="中華路、青埔、實踐"></label>
    <label id="wAge">屋齡上限<input type="number" id="fAge" placeholder="不限" style="width:80px"></label>
    <label id="wFlag">記號<select id="fFlag"><option value="">全部</option><option value="轉售">中古轉售(真行情)</option><option value="交屋">預售交屋</option><option value="一般">一般中古</option></select></label>
    <label class="chk" id="wResi"><input type="checkbox" id="fResi" checked> 只看住宅</label>
    <label class="chk" id="wSpec"><input type="checkbox" id="fSpec" checked> 排除特殊交易</label>
    <label>排序<select id="fS"></select></label>
    <span class="count" id="cnt"></span>`;
  fMode.value=s.mode;
  const setSort=()=>{fS.innerHTML = s.mode==="bldg"
    ? `<option value="cnt">成屋成交↓</option><option value="resold">確認轉售↓</option><option value="avg">均價↓</option><option value="p2">最新成交↓</option>`
    : `<option value="date">交易日↓</option><option value="unit">單價↓</option><option value="total">總價↓</option>`;};
  setSort();
  const per=50;
  const pager=(n,pg)=>`<div class="pager"><button id="pp" ${pg<=0?'disabled':''}>‹ 上一頁</button>
    <span>第 ${pg+1} / ${Math.max(1,Math.ceil(n/per))} 頁</span>
    <button id="pn" ${(pg+1)*per>=n?'disabled':''}>下一頁 ›</button></div>`;
  const paint=()=>{
    const list=s.list,pg=s.page,slice=list.slice(pg*per,pg*per+per);
    let html;
    if(s.mode==="bldg"){
      html=`<table><thead><tr><th class="l">建案名</th><th class="l">社區/棟（門牌到「號」）</th><th data-sk="cnt">成屋<br><small>成交</small></th><th data-sk="resold">確認<br><small>轉售</small></th>
        <th class="hidem">型態</th><th data-sk="avg">全期<br><small>均價</small></th><th>近3年<br><small>中位</small></th><th class="hidem">單價區間</th><th class="l" data-sk="p2">成交期間</th>
        </tr></thead><tbody>${slice.map(bRow).join("")||empty(9)}</tbody></table>`+pager(list.length,pg);
    }else{
      html=`<table><thead><tr><th class="l">社區/建案</th><th class="l">門牌 / 行政區</th><th class="hidem">型態</th><th class="hidem">用途</th><th>屋齡</th><th>格局</th>
        <th class="hidem">權狀<br><small>坪</small></th><th class="hidem">車位<br><small>坪/萬</small></th><th class="hidem">樓/總</th><th data-sk="unit">單價<br><small>萬/坪</small></th><th data-sk="total">總價<br><small>萬</small></th><th class="l" data-sk="date">交易日</th>
        </tr></thead><tbody>${slice.map(rRow).join("")||empty(12)}</tbody></table>`+pager(list.length,pg);
    }
    document.getElementById("tablewrap").innerHTML=html;
    const pp=document.getElementById("pp"),pn=document.getElementById("pn");
    if(pp)pp.onclick=()=>{s.page--;paint();window.scrollTo(0,0);};
    if(pn)pn.onclick=()=>{s.page++;paint();window.scrollTo(0,0);};
    if(s.mode==="bldg")document.querySelectorAll("tr.prow").forEach(tr=>tr.addEventListener("click",()=>drillBldg(tr,TX)));
    else document.querySelectorAll("tr.rprow").forEach(tr=>tr.addEventListener("click",()=>drillPrev(tr)));
    wireSort("fS");
  };
  const draw=()=>{
    s.mode=fMode.value;
    ["wB","wAge","wFlag","wResi","wSpec"].forEach(id=>document.getElementById(id).style.display=s.mode==="bldg"?"none":"");
    const d=fD.value,q=fQ.value.trim(),sk=fS.value;
    if(s.mode==="bldg"){
      let list=BLDG.filter(r=>(!d||r.d===d)&&matchQ(q,r.b,r.proj));
      list.sort((a,b)=>{if(sk==="p2")return (b.p2||"").localeCompare(a.p2||"");return (b[sk]??-1)-(a[sk]??-1);});
      s.list=list; cnt.textContent=`符合 ${list.length.toLocaleString()} 棟（皆 2 筆以上成交）`;
    }else{
      const b=fB.value,ag=+fAge.value||0,fl=fFlag.value,resi=fResi.checked,spec=fSpec.checked;
      const flOK=r=>!fl||(fl==="一般"?(r[18]||"")==="":r[18]===fl);
      let list=TX.filter(r=>(!d||r[0]===d)&&(!b||r[3]===b)&&matchQ(q,r[1],r[12])&&(!ag||(r[4]!=null&&r[4]<=ag))&&flOK(r)&&(!resi||r[15]===1)&&(!spec||r[16]===0));
      const idx={date:2,unit:10,total:11}[sk]||2;
      list.sort((a,b2)=>{if(sk==="date")return (b2[2]||"").localeCompare(a[2]||"");return (b2[idx]??-1)-(a[idx]??-1);});
      s.list=list; cnt.textContent=`符合 ${list.length.toLocaleString()} 筆`;
    }
    s.page=Math.min(s.page,Math.floor(Math.max(0,s.list.length-1)/per));
    paint();
  };
  fMode.addEventListener("change",()=>{s.page=0;setSort();draw();});
  ["fD","fB","fQ","fAge","fFlag","fS","fResi","fSpec"].forEach(id=>document.getElementById(id).addEventListener("input",()=>{s.page=0;draw();}));
  draw();
}
function projName(name,custom){return name?`<span class="pname">${name}</span>${custom?'<span class="badge-custom" title="貝多自建社區名（內政部開放資料無此名，人工對照）">自訂</span>':''}`:'<span class="muted">—</span>';}
function flagBadge(f){return f==='交屋'?'<span class="badge-move" title="建商→原預售買方過戶，成交價為當年預售價，與預售簽約多為同一批戶">交屋過戶</span>'
  :f==='轉售'?'<span class="badge-resale" title="同一門牌第2次起成交，真正的中古市場轉售">中古轉售</span>'
  :f==='換約'?'<span class="badge-huan" title="預售合約轉讓(換約)，來自即時查詢網">換約</span>':'';}
// 車位格：area=車位坪 price=車位價萬 est(0實登/1回推/2無法回推含車位)
function carCell(area,price,est){
  if(area==null) return '<span class="muted">無</span>';
  if(est===2) return `${area.toFixed(1)}<span class="muted">/價未登</span>`;
  if(est===1) return `${area.toFixed(1)}/<span title="同社區同車位類別回推估算">~${price!=null?price.toLocaleString():'?'}</span>`;
  return `${area.toFixed(1)}/${price!=null?price.toLocaleString():'—'}`;
}
// 單價格：去車位單價，回推車位價標「估」、含車位標「含」
function unitCell(u,est){
  if(u==null) return '<span class="muted">—</span>';
  const mk=est===1?'<sup class="umk" title="車位價由同社區回推，去車位單價為估算">估</sup>':est===2?'<sup class="umk" title="無社區車位價可回推，此為含車位單價">含</sup>':'';
  return u.toFixed(1)+mk;
}
function rRow(r){
  const resale = r[18]==='轉售' && r[22];  // 轉售且有前手 → 可點開看漲跌
  const attr = resale ? ` class="rprow" data-cd="${r[2]}" data-cu="${r[10]??''}" data-ct="${r[11]??''}" data-pd="${r[22]}" data-pu="${r[23]??''}" data-pt="${r[24]??''}"` : '';
  const pk = carCell(r[20],r[21],r[25]);
  return `<tr${attr}>
  <td class="l">${projName(r[12],r[26])} ${flagBadge(r[18])}${r[27]?'<span class="badge-rt" title="來自即時查詢網(每旬更新)，批次尚未收錄">即時</span>':''}</td>
  <td class="l"><span class="dist">${r[0]}</span>${shortAddr(r[0],r[1])}</td>
  <td class="hidem">${r[3]||''}</td>
  <td class="hidem">${r[14]||''}${r[17]?` <span class="zone">${r[17]}</span>`:''}${r[16]===1?' <span class="badge-term">特殊</span>':''}</td>
  <td>${r[4]!=null?r[4]+'年':'<span class="muted">—</span>'}</td>
  <td>${r[5]}房${r[6]}廳${r[7]}衛</td>
  <td class="hidem">${r[19]!=null?r[19].toFixed(1):'<span class="muted">—</span>'}</td>
  <td class="hidem">${pk}</td>
  <td class="hidem">${r[8]||''}/${r[9]||''}</td>
  <td class="price">${unitCell(r[10],r[25])}</td>
  <td>${r[11]!=null?r[11].toLocaleString():'<span class="muted">—</span>'}</td>
  <td class="l"><span class="rng">${r[2]||''}</span></td></tr>`;}
function drillPrev(tr){
  const nx=tr.nextElementSibling; if(nx&&nx.classList.contains("detail")){nx.remove();return;}
  const d=tr.dataset, cu=+d.cu, pu=+d.pu, ct=+d.ct, pt=+d.pt;
  const upChg=pu?(cu-pu)/pu*100:null, ptChg=pt?(ct-pt)/pt*100:null;
  const yrs=(new Date(d.cd)-new Date(d.pd))/(365.25*864e5);
  const sg=v=>v>0?'color:#c0392b;font-weight:700':v<0?'color:#1a8a4f;font-weight:700':'';
  const diff=(now,prev,pct)=>pct==null?'—':`${now-prev>0?'+':''}${(now-prev).toLocaleString(undefined,{maximumFractionDigits:1})}（${pct>0?'+':''}${pct.toFixed(1)}%）`;
  const inner=`<thead><tr><th></th><th>成交日</th><th style="text-align:right">單價萬/坪</th><th style="text-align:right">總價萬</th></tr></thead><tbody>
    <tr><td>上一手</td><td>${d.pd}</td><td style="text-align:right">${pu||'—'}</td><td style="text-align:right">${pt?pt.toLocaleString():'—'}</td></tr>
    <tr><td>本次轉售</td><td>${d.cd}</td><td style="text-align:right">${cu||'—'}</td><td style="text-align:right">${ct?ct.toLocaleString():'—'}</td></tr>
    <tr><td>價差 / 漲跌幅<br><small>持有約 ${yrs.toFixed(1)} 年</small></td><td></td>
      <td style="text-align:right;${sg(upChg)}">${diff(cu,pu,upChg)}</td>
      <td style="text-align:right;${sg(ptChg)}">${diff(ct,pt,ptChg)}</td></tr>
  </tbody>`;
  insertDetail(tr,12,"上一手成交比較（同一門牌）",inner);
}
function bRow(r){return `<tr class="prow" data-k="${encodeURIComponent(r.d+"|"+r.b)}">
  <td class="l">${r.proj?`<span class="pname">${r.proj}</span>`:'<span class="muted">—</span>'}</td>
  <td class="l"><span class="dist">${r.d}</span>${shortAddr(r.d,r.b)}</td>
  <td class="price">${r.cnt}</td>
  <td>${r.resold?`<b style="color:var(--resale)">${r.resold}</b>`:'<span class="muted">0</span>'}</td>
  <td class="hidem">${r.bt||''}</td>
  <td class="price">${fmt(r.avg)}</td>
  <td class="price" style="color:var(--resale)">${r.med3!=null?fmt(r.med3):'<span class="muted">—</span>'}</td>
  <td class="hidem">${r.lo!=null?`<span class="rng">${fmt(r.lo)}–${fmt(r.hi)}</span>`:'<span class="muted">—</span>'}</td>
  <td class="l"><span class="rng">${r.p1||''} ~ ${r.p2||''}</span></td></tr>`;}
async function drillBldg(tr,TX){
  const nx=tr.nextElementSibling; if(nx&&nx.classList.contains("detail")){nx.remove();return;}
  const [d,b]=decodeURIComponent(tr.dataset.k).split("|");
  const rows=TX.filter(r=>r[0]===d&&(r[1]||"").startsWith(b)).sort((a,b2)=>(b2[2]||"").localeCompare(a[2]||""));

function mix(a,b,t){return a.map((x,i)=>Math.round(x+(b[i]-x)*t));}
function heat(v,min,max){const t=Math.max(0,Math.min(1,(v-min)/((max-min)||1)));
  const c=t<0.5?mix([46,158,91],[224,165,43],t*2):mix([224,165,43],[208,69,43],(t-0.5)*2);
  return `rgb(${c[0]},${c[1]},${c[2]})`;}

      <tbody>${list.map(r=>`<tr><td class="l"><span class="pname">${r[0]||'—'}</span></td><td class="l">${shortAddr('',r[1])}</td>

      <div style="font-size:12px;color:var(--sub);margin-bottom:8px">共 <b style="color:var(--navy)">${totalN.toLocaleString()}</b> 筆 = 以下 ${bd.length} 個建案（已排除政策宅/特殊交易）</div>

      <tbody>${bd.map(r=>`<tr><td class="l"><span class="pname">${r[0]}</span></td><td class="price">${r[1]}</td>

      {type:"line",label:"中位單價(萬/坪)",data:med,yAxisID:"y1",borderColor:"#1a6fb0",backgroundColor:"#1a6fb0",borderWidth:2.5,pointRadius:2,tension:.25,order:1,spanGaps:true}
    ]},options:{responsive:true,maintainAspectRatio:true,interaction:{mode:"index",intersect:false},
      scales:{y:{position:"left",beginAtZero:true,title:{display:true,text:"成交量(筆)"},grid:{color:"#f0f3f6"}},
              y1:{position:"right",title:{display:true,text:"中位單價(萬/坪)"},grid:{drawOnChartArea:false}}},
      plugins:{legend:{position:"top",labels:{boxWidth:14,font:{size:12}}},
        tooltip:{callbacks:{}}}}});
    cnt.textContent=`${MK_LABEL[s.mk]}｜2018 至今 ${d.length} 季`;
  };
  fMk.addEventListener("change",draw); draw();
}

/* ===== 共用 ===== */
// 點欄位標題排序：th[data-sk] 對應排序下拉的值，點一下=切到該排序
function wireSort(selId){
  const sel=document.getElementById(selId); if(!sel)return;
  document.querySelectorAll("#tablewrap thead th[data-sk]").forEach(th=>{
    th.style.cursor="pointer"; th.title="點擊依此欄排序";
    if(th.dataset.sk===sel.value) th.style.color="var(--blue)";
    th.onclick=()=>{sel.value=th.dataset.sk; sel.dispatchEvent(new Event("input",{bubbles:true}));};
  });
}
function empty(c){return `<tr><td colspan="${c}" style="text-align:center;padding:30px;color:#999">查無符合條件的資料</td></tr>`;}
function insertDetail(tr,span,title,inner){
  const det=document.createElement("tr");det.className="detail";
  det.innerHTML=`<td colspan="${span}"><div class="dwrap"><h4>${title}</h4><table class="tx">${inner}</table></div></td>`;
  tr.after(det);
}
boot().catch(e=>{const sp=document.getElementById("splash");if(sp)sp.classList.add("hide");
  document.getElementById("sub").textContent="⚠ 資料載入失敗，請用本機伺服器開啟(見頁尾)。"+e;});
</script>
